apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-exp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-exp-frontend
  template:
    metadata:
      labels:
        app: travel-exp-frontend
    spec:
      containers:
      - name: frontend
        image: aeroserg/travel-exp-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: http://travel-exp-backend-svc:4000
---
apiVersion: v1
kind: Service
metadata:
  name: travel-exp-frontend-svc
spec:
  type: NodePort
  selector:
    app: travel-exp-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 32000