# k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-exp-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: 158.160.44.174.nip.io
    http:
      paths:
      # --- BACKEND ---
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: travel-exp-backend-svc
            port:
              number: 4000
      # --- FRONTEND ---
      - path: /
        pathType: Prefix
        backend:
          service:
            name: travel-exp-frontend-svc
            port:
              number: 3000
