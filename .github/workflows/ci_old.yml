name: travel-app-ci

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-backend
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        options: >-
          --health-cmd "echo ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://root:password@localhost:27017/travel-exp?authSource=admin
      JWT_SECRET: test_jwt
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Generate coverage report
        working-directory: backend
        run: npm test -- --coverage

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Sonar Scanner CLI
        run: npm install -g sonar-scanner

      - name: Run SonarQube analysis
        env:
          SONAR_HOST_URL: http://158.160.44.174.nip.io:32340
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.projectKey=travel-exp-app \
            -Dsonar.sources=backend,frontend \
            -Dsonar.tests=backend,frontend \
            -Dsonar.test.inclusions="**/*.spec.ts,**/*.test.ts" \
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

      - name: Await Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.0.0
        env :
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  push-backend-image:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            aeroserg/travel-exp-backend:latest
            aeroserg/travel-exp-backend:${{ github.ref_name }}

  push-frontend-image:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            aeroserg/travel-exp-frontend:latest
            aeroserg/travel-exp-frontend:${{ github.ref_name }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs:
      - push-backend-image
      - push-frontend-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Yandex.Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Yandex.Cloud login
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          echo "$YC_SA_KEY" > /tmp/sa.json
          yc auth activate-service-account --key-file /tmp/sa.json

      - name: Configure kubectl for Yandex Managed k8s
        run: |
          yc managed-kubernetes cluster get-credentials travel-app-kuber --external

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/backend-servicemonitor.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/backend-hpa.yaml
          kubectl apply -f k8s/mongo.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/backend-hpa.yaml

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ always() }}
    steps:
      - name: Notify Success to Telegram
        if: ${{ success() }}
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to:    ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ✅ *CI & CD прошли успешно!*
            Проект: `travel-exp-app`
            Коммит: `${{ github.sha }}`
            Среда: продакшн

      - name: Notify Failure to Telegram
        if: ${{ failure() }}
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to:    ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ❌ *CI или CD провалились!*
            Проект: `travel-exp-app`
            Шаг: `${{ github.job }}`
            Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
