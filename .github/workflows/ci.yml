name: travel-app-ci

on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_and_sonar:
    name: Сборка, тесты, покрытие и SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with: { node-version: 20 }

      - name: Кэшировать зависимости
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Установить и протестировать backend (с покрытием)
        working-directory: backend
        run: |
          npm ci
          npm run test:cov
          ls -l coverage/lcov.info

      - name: Установить и протестировать frontend (с покрытием)
        working-directory: frontend
        run: |
          npm ci
          npm run test:cov
          ls -l coverage/lcov.info

      - name: Sonar Scanner
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "${{ github.workspace }}":/usr/src \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=travel-exp-app \
            -Dsonar.sources=backend,frontend \
            -Dsonar.tests=backend,frontend \
            -Dsonar.test.inclusions="**/*.spec.ts,**/*.test.ts" \
            -Dsonar.coverage.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/coverage/**" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Проверить Quality Gate
        uses: phwt/sonarqube-quality-gate-action@v1
        with:
          sonar-host-url:    ${{ secrets.SONAR_HOST_URL }}
          sonar-project-key: travel-exp-app
          sonar-token:       ${{ secrets.SONAR_TOKEN }}
          github-token:      ${{ secrets.GITHUB_TOKEN }}
          fail-on-quality-gate-error: false

  push_images:
    name: Сборка и публикация Docker-образов
    runs-on: ubuntu-latest
    needs: build_and_sonar
    steps:
      - uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push:    true
          tags: |
            aeroserg/travel-exp-backend:latest
            aeroserg/travel-exp-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    true
          tags: |
            aeroserg/travel-exp-frontend:latest
            aeroserg/travel-exp-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name: Деплой
    runs-on: ubuntu-latest
    needs: [build_and_sonar, push_images]
    steps:
      - uses: actions/checkout@v3
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      - name: Install YC CLI
        run: |
            curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
            $HOME/yandex-cloud/bin/yc --version
      - name: YC CLI Auth and K8s creds
        env:
          YC_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
            curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
            $HOME/yandex-cloud/bin/yc --version
            export PATH=$PATH:$HOME/yandex-cloud/bin
            echo "$YC_KEY" > key.json
            $HOME/yandex-cloud/bin/yc config set service-account-key key.json
            $HOME/yandex-cloud/bin/yc config set folder-id "$YC_FOLDER_ID"
            $HOME/yandex-cloud/bin/yc managed-kubernetes cluster get-credentials travel-app-kuber --external
      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend
      - name: Healthcheck
        run: |
          kubectl get pods -A
      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to:    ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Deploy завершён. Коммит: ${{ github.sha }}. Статус: ${{ job.status }}

  notify:
    name: Уведомить в Telegram
    runs-on: ubuntu-latest
    needs: [build_and_sonar, push_images, deploy]
    if: ${{ always() }}
    steps:
        - name: Определить упавший этап
          id: check_fail
          run: |
            failed_job=""
            if [[ "${{ needs.build_and_sonar.result }}" == "failure" ]]; then
            failed_job="Сборка/тесты/Sonar"
            elif [[ "${{ needs.push_images.result }}" == "failure" ]]; then
            failed_job="Docker build/push"
            elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            failed_job="Deploy"
            fi
            echo "FAILED_JOB=$failed_job" >> $GITHUB_ENV

        - name: Успех
          if: ${{ env.FAILED_JOB == '' }}
          uses: appleboy/telegram-action@master
          with:
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            to:    ${{ secrets.TELEGRAM_CHAT_ID }}
            message: |
                ✅ CI/CD успешно прошли
                Коммит: ${{ github.sha }}
                Ветка: ${{ github.ref_name }}

        - name: Ошибка
          if: ${{ env.FAILED_JOB != '' }}
          uses: appleboy/telegram-action@master
          with:
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            to:    ${{ secrets.TELEGRAM_CHAT_ID }}
            message: |
                ❌ CI/CD упал на этапе: *${{ env.FAILED_JOB }}*
                Ссылка: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


