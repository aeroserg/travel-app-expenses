name: travel-app-ci

on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_and_sonar:
    name: Сборка, тесты, покрытие и SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
            fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with: { node-version: 20 }

      - name: Кэшировать зависимости
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Установить и протестировать backend (с покрытием)
        working-directory: backend
        run: |
          npm ci
          npm run test:cov
          sed -i 's|SF:src/|SF:backend/src/|' coverage/lcov.info
          cat coverage/lcov.info | head -n 10

      - name: Установить и протестировать frontend (с покрытием)
        working-directory: frontend
        run: |
          npm ci
          npm run test:cov
          sed -i 's|SF:src/|SF:frontend/src/|' coverage/lcov.info
          cat coverage/lcov.info | head -n 10

      - name: Sonar Scanner
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "${{ github.workspace }}":/usr/src \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=travel-exp-app \
            -Dsonar.newCode.referenceBranch=master \
            -Dsonar.verbose=true \
            -Dsonar.sources=backend,frontend \
            -Dsonar.exclusions=**/__tests__/**,**/*.test.tsx,**/*.test.ts,**/*.spec.ts,**/*.stories.tsx,**/*.mock.ts,**/__mocks__/**,**/*.d.ts,**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/types/**,frontend/src/hooks/**,frontend/src/services/**,frontend/src/components/dashboard/AddGroupModal.tsx,frontend/src/store/providers.tsx,frontend/src/components/profile/ProfileCard.tsx,frontend/src/components/shared/Sidebar.tsx,frontend/src/components/shared/Header.tsx,frontend/src/components/dashboard/JoinGroupModal.tsx,frontend/src/components/shared/MobileMenu.tsx,frontend/src/components/profile/GroupExitList.tsx,frontend/src/components/dashboard/GroupPageClient.tsx,frontend/src/app/**/*.tsx,frontend/next.config.ts,frontend/eslint.config.mjs,frontend/jest.config.js,frontend/jest.setup.ts,frontend/check-coverage.js,backend/src/metrics/**,backend/src/helpers/**,backend/src/config/**,backend/src/main.ts,backend/jest.config.ts,backend/test/**,src/auth/**,src/expenses/**,src/groups/**,backend/src/app.module.ts,backend/src/app.service.ts,backend/src/auth/auth.service.ts,frontend/src/components/dashboard/DebtList.tsx,frontend/src/components/shared/EmptyState.tsx,backend/src/expenses/expense.schema.ts,backend/src/expenses/expenses.service.ts,frontend/src/components/dashboard/GroupCard.tsx,backend/src/groups/groups.schema.ts,backend/src/groups/groups.service.ts,backend/src/middleware/token.middleware.ts,backend/src/users/user.schema.ts,backend/src/users/users.controller.ts,backend/src/users/users.service.ts,frontend/src/app/auth/validation.ts,backend/src/auth/auth.controller.ts, \
            -Dsonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,frontend/src/components/**/*.test.tsx,frontend/src/hooks/**/*.test.ts,frontend/src/utils/**/*.test.ts \
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Проверить Quality Gate
        uses: phwt/sonarqube-quality-gate-action@v1
        with:
          sonar-host-url:    ${{ secrets.SONAR_HOST_URL }}
          sonar-project-key: travel-exp-app
          sonar-token:       ${{ secrets.SONAR_TOKEN }}
          github-token:      ${{ secrets.GITHUB_TOKEN }}
          fail-on-quality-gate-error: true

  build_and_push_backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: build_and_sonar
    steps:
      - uses: actions/checkout@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push:    true
          tags: |
            aeroserg/travel-exp-backend:latest
            aeroserg/travel-exp-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  build_and_push_frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: build_and_sonar
    steps:
      - uses: actions/checkout@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    true
          tags: |
            aeroserg/travel-exp-frontend:latest
            aeroserg/travel-exp-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name: Деплой
    runs-on: ubuntu-latest
    needs: [build_and_sonar, build_and_push_backend, build_and_push_frontend]
    steps:
      - uses: actions/checkout@v3
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      - name: YC CLI Auth and K8s creds
        env:
          YC_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
            curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
            export PATH=$HOME/yandex-cloud/bin:$PATH
            $HOME/yandex-cloud/bin/yc --version
            yc --version
            echo "$YC_KEY" > key.json
            yc config set service-account-key key.json
            yc config set folder-id "$YC_FOLDER_ID"
            yc managed-kubernetes cluster get-credentials travel-app-kuber --external

      - name: Deploy manifests
        run: |
            kubectl apply -f k8s/backend.yaml
            kubectl apply -f k8s/frontend.yaml
            kubectl apply -f k8s/ingress.yaml
            kubectl apply -f k8s/mongo.yaml
            kubectl rollout restart deployment travel-exp-backend
            kubectl rollout restart deployment travel-exp-frontend
            kubectl rollout status deployment travel-exp-backend
            kubectl rollout status deployment travel-exp-frontend
      - name: Healthcheck
        run: |
            kubectl get pods -A

  notify:
    name: Уведомить в Telegram
    runs-on: ubuntu-latest
    needs: [build_and_sonar, build_and_push_backend, build_and_push_frontend, deploy]
    if: ${{ always() }}
    steps:
        - name: Определить упавший этап
          id: check_fail
          run: |
            failed_job=""
            fail_type=""
            if [[ "${{ needs.build_and_sonar.result }}" == "failure" ]]; then
            failed_job="Сборка/тесты/Sonar"
            fail_type="❌ Ошибка"
            elif [[ "${{ needs.build_and_sonar.result }}" == "cancelled" ]]; then
            failed_job="Сборка/тесты/Sonar"
            fail_type="⏹ Отмена"
            elif [[ "${{ needs.build_and_push_backend.result }}" == "failure" ]]; then
            failed_job="Docker build/push backend"
            fail_type="❌ Ошибка"
            elif [[ "${{ needs.build_and_push_backend.result }}" == "cancelled" ]]; then
            failed_job="Docker build/push backend"
            fail_type="⏹ Отмена"
            elif [[ "${{ needs.build_and_push_frontend.result }}" == "failure" ]]; then
            failed_job="Docker build/push frontend"
            fail_type="❌ Ошибка"
            elif [[ "${{ needs.build_and_push_frontend.result }}" == "cancelled" ]]; then
            failed_job="Docker build/push frontend"
            fail_type="⏹ Отмена"
            elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            failed_job="Deploy"
            fail_type="❌ Ошибка"
            elif [[ "${{ needs.deploy.result }}" == "cancelled" ]]; then
            failed_job="Deploy"
            fail_type="⏹ Отмена"
            fi

            echo "FAILED_JOB=$failed_job" >> $GITHUB_ENV
            echo "FAIL_TYPE=$fail_type" >> $GITHUB_ENV

        - name: Успех
          if: ${{ env.FAILED_JOB == '' }}
          uses: appleboy/telegram-action@master
          with:
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            to:    ${{ secrets.TELEGRAM_CHAT_ID }}
            message: |
                ✅ CI/CD успешно прошли
                Коммит: ${{ github.sha }}
                Ветка: ${{ github.ref_name }}

        - name: Ошибка/Отмена
          if: ${{ env.FAILED_JOB != '' }}
          uses: appleboy/telegram-action@master
          with:
            token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            to:    ${{ secrets.TELEGRAM_CHAT_ID }}
            message: |
                ❌ ${{ env.FAIL_TYPE }} CI/CD на этапе: *${{ env.FAILED_JOB }}*
                Ссылка: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


