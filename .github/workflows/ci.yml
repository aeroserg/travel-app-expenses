name: travel-app-ci

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_test:
    name: Сборка, тесты и проверка покрытия
    runs-on: ubuntu-latest
    steps:
      # Берём код
      - name: Checkout code
        uses: actions/checkout@v3

      # Устанавливаем Node.js
      - name: Настроить Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Кэшируем зависимости (backend и frontend)
      - name: Кэшировать модули
        uses: actions/cache@v3
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      # Устанавливаем и тестируем backend
      - name: Установить зависимости (backend)
        run: npm ci
        working-directory: backend

      - name: Запустить тесты и собрать покрытие (backend)
        run: |
          npm run test:cov
          npm run check:coverage
        working-directory: backend

      # Устанавливаем и тестируем frontend
      - name: Установить зависимости (frontend)
        run: npm ci
        working-directory: frontend

      - name: Запустить тесты и собрать покрытие (frontend)
        run: |
          npm run test:cov
          npm run check:coverage
        working-directory: frontend

  sonar:
    name: Статический анализ в SonarQube
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Установить Sonar Scanner
        run: npm install -g sonar-scanner

      - name: Запустить анализ SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=travel-exp-app \
            -Dsonar.sources=backend,frontend \
            -Dsonar.tests=backend,frontend \
            -Dsonar.test.inclusions="**/*.spec.ts,**/*.test.ts" \
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

      - id: qualitygate
        name: Проверка Quality Gate
        uses: phwt/sonarqube-quality-gate-action@v1
        with:
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-project-key: travel-exp-app
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  push_images:
    name: Сборка и публикация Docker-образов
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Войти в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Сборка и публикация backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            aeroserg/travel-exp-backend:latest
            aeroserg/travel-exp-backend:${{ github.ref_name }}

      - name: Сборка и публикация frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            aeroserg/travel-exp-frontend:latest
            aeroserg/travel-exp-frontend:${{ github.ref_name }}

  deploy:
    name: Развёртывание в Kubernetes
    runs-on: ubuntu-latest
    needs: push_images
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Настроить kubectl
        uses: azure/setup-kubectl@v3

      - name: Аутентификация в Yandex.Cloud
        run: |
          echo "${{ secrets.YC_SA_KEY }}" > /tmp/sa.json
          yc iam key add --folder-id ${{ secrets.YC_FOLDER_ID }} /tmp/sa.json

      - name: Применить манифесты
        run: |
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/mongo.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/backend-hpa.yaml

  notify:
    name: Уведомить в Telegram
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() }}
    steps:
      - name: Уведомление об успехе
        if: ${{ success() }}
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to:    ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            CI/CD завершились успешно.
            Коммит: ${{ github.sha }}
            Проект: travel-exp-app

      - name: Уведомление о провале
        if: ${{ failure() }}
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to:    ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            CI/CD завершились с ошибкой.
            Проект: travel-exp-app
            Шаг: ${{ github.job }}
            Подробнее: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
